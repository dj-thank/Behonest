name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create full Flutter project
        run: bash scripts/create_flutter_project.sh be_honest_app

      - name: Get dependencies
        working-directory: be_honest_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: be_honest_app
        run: flutter analyze

      - name: Build debug APK
        working-directory: be_honest_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: be-honest-debug-apk
          path: be_honest_app/build/app/outputs/flutter-apk/app-debug.apk
