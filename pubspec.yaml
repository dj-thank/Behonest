name: be_honest
description: A private travel moment app for friends.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.0.0 <5.0.0"
  firebase_auth: ">=5.0.0 <7.0.0"
  cloud_firestore: ">=5.0.0 <7.0.0"
  firebase_storage: ">=12.0.0 <15.0.0"
  firebase_messaging: ">=15.0.0 <18.0.0"
  cloud_functions: ">=5.0.0 <7.0.0"
  flutter_local_notifications: ">=17.0.0 <22.0.0"
  camera: ">=0.11.0 <0.13.0"
  image: ">=4.0.0 <5.0.0"
  path: ">=1.9.0 <2.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  uuid: ">=4.0.0 <5.0.0"
  intl: ">=0.19.0 <0.21.0"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
